name: App Android

# Builds an installable APK on GitHub's machines, so no Android SDK or Java
# has to be installed locally. Download it from the release below.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-web/**"
      - ".github/workflows/android.yml"
      # Adding or updating a Capacitor plugin changes the native build even
      # when nothing under android/ is touched.
      - "package.json"
      - "package-lock.json"

jobs:
  apk:
    name: APK di prova
    runs-on: ubuntu-latest

    # Needed to publish the build as a release.
    permissions:
      contents: write

    env:
      # Secrets cannot be read inside `if:` directly, so the presence check is
      # hoisted here. Without the key the build still runs, unsigned.
      HAS_KEYSTORE: ${{ secrets.WORKBIT_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The Android project resolves the Capacitor library out of
      # node_modules, so the dependencies have to be present before Gradle
      # runs — the native folder alone is not enough to build.
      - name: Installa le dipendenze
        run: npm ci

      # Regenerates capacitor-cordova-android-plugins and copies the web
      # assets. That folder is deliberately not committed.
      - name: Sincronizza il progetto nativo
        run: npx cap sync android

      # The keystore never lives in the repository: it is rebuilt here from an
      # encrypted secret and discarded with the machine.
      - name: Prepara la chiave di firma
        if: env.HAS_KEYSTORE == 'true'
        run: |
          printf '%s' '${{ secrets.WORKBIT_KEYSTORE_BASE64 }}' | base64 -d > "$RUNNER_TEMP/workbit-upload.p12"
          echo "WORKBIT_KEYSTORE_PATH=$RUNNER_TEMP/workbit-upload.p12" >> "$GITHUB_ENV"
          echo "WORKBIT_KEYSTORE_PASSWORD=${{ secrets.WORKBIT_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "WORKBIT_KEY_ALIAS=workbit" >> "$GITHUB_ENV"

      # Git on Windows does not keep the executable bit, so set it here.
      - name: Rendi eseguibile gradlew
        run: chmod +x android/gradlew

      - name: Compila l'APK
        working-directory: android
        run: |
          if [ -n "${WORKBIT_KEYSTORE_PATH:-}" ]; then
            echo "Compilo la versione firmata."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Nessuna chiave configurata: compilo la versione di prova."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Individua il file prodotto
        run: |
          APK="$(find android/app/build/outputs/apk -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" workbit.apk
          echo "APK pronto: $APK"

      - name: Pubblica l'APK da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: workbit-android
          path: workbit.apk
          if-no-files-found: error

      # Artifacts can only be downloaded from a desktop browser, and arrive
      # zipped. A release keeps one stable link that installs straight from a
      # phone, so the APK is always one tap away.
      - name: Aggiorna la release scaricabile dal telefono
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete anteprima-android --yes --cleanup-tag || true
          gh release create anteprima-android workbit.apk \
            --title "Workbit Android · anteprima" \
            --notes "Versione di prova, aggiornata automaticamente a ogni modifica dell'app.

          Scarica \`workbit.apk\` qui sotto e aprilo sul telefono per installarlo.
          Android chiederà il permesso di installare da fonte sconosciuta: è normale."
