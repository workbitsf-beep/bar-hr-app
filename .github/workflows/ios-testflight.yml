name: App iOS · TestFlight

# Builds the signed iPhone app on GitHub's Macs and uploads it to TestFlight,
# so no Mac is needed. Started by hand from the Actions tab ("Run workflow").
#
# It needs an Apple Developer account and these repository secrets
# (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID      the 10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key: its Key ID
#   ASC_ISSUER_ID      App Store Connect API key: the Issuer ID above the list
#   ASC_KEY_P8         the .p8 file's whole text, BEGIN and END lines included
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD, IOS_PROFILE
#                      the distribution certificate and App Store profile, made
#                      by scripts/ios-signing-setup.ts (valid one year)
# The key is created in App Store Connect > Users and Access > Integrations >
# App Store Connect API, with the Admin role.
#
# Optional, for push notifications on iPhone:
#   GOOGLE_SERVICE_INFO_PLIST  the text of GoogleService-Info.plist from Firebase
on:
  workflow_dispatch:

jobs:
  testflight:
    name: Firma e carica su TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Controlla i segreti
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DIST_P12 IOS_DIST_P12_PASSWORD IOS_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Mancano i segreti:$missing (vedi l'inizio di questo file)."
            exit 1
          fi

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Sincronizza il progetto nativo
        run: npx cap sync ios

      - name: Chiave App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Where altool looks for it when uploading.
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/"AuthKey_$ASC_KEY_ID.p8"

      # Apple's cloud-managed signing refuses an API key on these machines
      # ("No Accounts with App Store Connect Access"), so the app is signed
      # with a distribution certificate and profile of our own.
      - name: Certificato e profilo di distribuzione
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Manual signing for the app target's Release configuration only: set
      # on the command line it would reach the Swift packages too, which
      # refuse a provisioning profile.
      - name: Firma manuale per l'app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          perl -0pi -e '
            s{(504EC3181FED79650016851F /\* Release \*/ = \{.*?buildSettings = \{)}{$1\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{APPLE_TEAM_ID};\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "Workbit App Store";}s;
            s{(504EC3181FED79650016851F /\* Release \*/ = \{.*?)CODE_SIGN_STYLE = Automatic;}{$1CODE_SIGN_STYLE = Manual;}s;
          ' ios/App/App.xcodeproj/project.pbxproj
          grep -c 'PROVISIONING_PROFILE_SPECIFIER = "Workbit App Store"' ios/App/App.xcodeproj/project.pbxproj
          grep -c 'CODE_SIGN_STYLE = Manual' ios/App/App.xcodeproj/project.pbxproj

      # Firebase reads it from the app bundle; without it the app works and
      # only push notifications stay off.
      - name: Configurazione Firebase (notifiche)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > "$RUNNER_TEMP/GoogleService-Info.plist"
            echo "FIREBASE_PLIST=$RUNNER_TEMP/GoogleService-Info.plist" >> "$GITHUB_ENV"
          else
            echo "::warning::GoogleService-Info.plist non impostato: l'app funziona, ma senza notifiche push."
          fi

      - name: Archivia (firmata)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Workbit.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Aggiungi la configurazione Firebase all'archivio
        if: env.FIREBASE_PLIST != ''
        run: |
          cp "$FIREBASE_PLIST" "$RUNNER_TEMP/Workbit.xcarchive/Products/Applications/App.app/GoogleService-Info.plist"

      # Export re-signs the whole app for the App Store, so a file added to
      # the archive above is covered by the signature.
      - name: Esporta l'app per l'App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>it.workbit.app</key><string>Workbit App Store</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Workbit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Carica su TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -t ios \
            -f "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Riepilogo
        run: echo "Build ${{ github.run_number }} caricata. Tra 10-30 minuti compare in App Store Connect > TestFlight."

      - name: Pulisci chiave e certificato
        if: always()
        run: |
          rm -rf ~/private_keys
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
