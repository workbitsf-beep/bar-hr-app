name: App iOS · TestFlight

# Builds the signed iPhone app on GitHub's Macs and uploads it to TestFlight,
# so no Mac is needed. Started by hand from the Actions tab ("Run workflow").
#
# It needs an Apple Developer account and these repository secrets
# (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID      the 10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key: its Key ID
#   ASC_ISSUER_ID      App Store Connect API key: the Issuer ID above the list
#   ASC_KEY_P8         the .p8 file's whole text, BEGIN and END lines included
# The key is created in App Store Connect > Users and Access > Integrations >
# App Store Connect API, with the Admin role: signing creates the certificate
# and the profile by itself through it.
#
# Optional, for push notifications on iPhone:
#   GOOGLE_SERVICE_INFO_PLIST  the text of GoogleService-Info.plist from Firebase
on:
  workflow_dispatch:

jobs:
  testflight:
    name: Firma e carica su TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Controlla i segreti
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Mancano i segreti:$missing (vedi l'inizio di questo file)."
            exit 1
          fi

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Sincronizza il progetto nativo
        run: npx cap sync ios

      - name: Chiave App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # Firebase reads it from the app bundle; without it the app works and
      # only push notifications stay off.
      - name: Configurazione Firebase (notifiche)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > "$RUNNER_TEMP/GoogleService-Info.plist"
            echo "FIREBASE_PLIST=$RUNNER_TEMP/GoogleService-Info.plist" >> "$GITHUB_ENV"
          else
            echo "::warning::GoogleService-Info.plist non impostato: l'app funziona, ma senza notifiche push."
          fi

      - name: Archivia (firmata)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Workbit.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Aggiungi la configurazione Firebase all'archivio
        if: env.FIREBASE_PLIST != ''
        run: |
          cp "$FIREBASE_PLIST" "$RUNNER_TEMP/Workbit.xcarchive/Products/Applications/App.app/GoogleService-Info.plist"

      # Export re-signs the whole app for the App Store, so a file added to
      # the archive above is covered by the signature.
      - name: Esporta e carica su TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Workbit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Riepilogo
        run: echo "Build ${{ github.run_number }} caricata. Tra 10-30 minuti compare in App Store Connect > TestFlight."

      - name: Pulisci la chiave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
