<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Workbit</title>
    <style>
      :root { color-scheme: light; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 32px 24px;
        background: #f7f3ff;
        color: #15161c;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #1b1830;
        color: #ffffff;
        display: grid;
        place-content: center;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .mark i { color: #a855f7; font-style: normal; }
      h1 { margin: 6px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 0; max-width: 34ch; font-size: 14px; line-height: 1.55; color: #5b5e70; }
    </style>
  </head>
  <body>
    <span class="mark">W<i>B</i></span>
    <h1>Connessione assente</h1>
    <p>Workbit ha bisogno della rete per mostrarti turni e timbrature. Controlla la connessione e riapri l&rsquo;app.</p>
  </body>
</html>
